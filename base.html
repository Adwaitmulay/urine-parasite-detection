<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Urine & Parasite Detection{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb}.brand{font-weight:700;color:#0d6efd}.hero{background:linear-gradient(135deg,#0d6efd,#20c997);color:#fff;border-radius:1rem}
.cardlink{text-decoration:none;color:inherit}.cardlink .card{transition:transform .15s}.cardlink:hover .card{transform:translateY(-3px)}</style></head><body>
<nav class="navbar navbar-expand bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand brand" href="/">Urine &amp; Parasite Detection</a>
<div class="ms-auto d-flex gap-3">
<a class="nav-link {{ 'fw-semibold text-primary' if page=='parasite' }}" href="/parasite">Parasite</a>
<a class="nav-link {{ 'fw-semibold text-primary' if page=='urine' }}" href="/urine">Urine</a></div></div></nav>
{% block body %}{% endblock %}
<footer class="container my-5 small text-muted">AI screening aid for education and research. Not a medical diagnosis; confirm results with a qualified clinician or laboratory.</footer>
</body></html>
